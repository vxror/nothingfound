name: Build and Deploy CS3 Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Extension with Gradle
        run: ./gradlew assembleRelease

      - name: Prepare Build Folder and Rename to CS3
        run: |
          mkdir -p build
          APK_PATH=$(find . -name "*-release-unsigned.apk" -o -name "*-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found after build!"
            exit 1
          fi
          cp "$APK_PATH" build/AnimeWitcher.cs3
          echo "Successfully copied $APK_PATH to build/AnimeWitcher.cs3"

      - name: Commit and Push CS3 to /build folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/AnimeWitcher.cs3
          if git diff --staged --quiet; then
            echo "No changes to commit. The .cs3 file is already up to date."
          else
            git commit -m "chore: update AnimeWitcher.cs3 [skip ci]"
            git push
          fi
