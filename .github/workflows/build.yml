name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew make --no-daemon
      - name: Copy
        run: |
          mkdir -p build
          rm -f build/AnimeWitcher.cs3
          cp Animewitcher/build/*.cs3 build/AnimeWitcher.cs3
          ls -la build/
      - name: Push
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/AnimeWitcher.cs3
          git commit -m "update cs3 [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeWitcher-cs3
          path: build/AnimeWitcher.cs3
