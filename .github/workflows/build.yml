name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Warm JitPack Cloudstream plugin
        run: |
          V="81b1d424d2"
          URL="https://jitpack.io/com/github/recloudstream/gradle/$V/gradle-$V.pom"
          echo "checking JitPack for com.github.recloudstream:gradle:$V ..."
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "artifact is live (HTTP 200) — gradle will resolve instantly"
              exit 0
            fi
            echo "  not ready yet (HTTP $CODE), attempt $i/40 — waiting 20s ..."
            sleep 20
          done
          echo "warning: JitPack still not serving the artifact after ~13 min"
          echo "gradle will try anyway; if it fails, the JitPack build itself is broken"
      - name: Build All
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew make --no-daemon && break
            if [ "$i" = "3" ]; then
              echo "gradle failed 3 times, giving up"
              exit 1
            fi
            echo "gradle failed (attempt $i), purging plugin cache and retrying..."
            rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream
            rm -rf ~/.gradle/caches/modules-2/metadata-*
            sleep 20
          done
      - name: Copy All Extensions
        run: |
          mkdir -p build
          rm -f build/Animewitcher.cs3 build/witanime.cs3 build/vxrux.cs3
          cp Animewitcher/build/*.cs3 build/Animewitcher.cs3 2>/dev/null || true
          cp witanime/build/*.cs3 build/witanime.cs3 2>/dev/null || true
          ls -la build/
      - name: Update plugins.json
        run: |
          python3 - <<'EOF'
          import json, os, hashlib, urllib.parse

          PLUGINS_JSON = 'plugins.json'   # change if yours lives elsewhere
          BUILD_DIR = 'build'

          if not os.path.exists(PLUGINS_JSON):
              print(f"WARNING: {PLUGINS_JSON} not found at repo root — nothing to update")
              raise SystemExit(0)

          with open(PLUGINS_JSON, 'r', encoding='utf-8') as f:
              plugins = json.load(f)

          updated = 0
          for item in plugins:
              url = item.get('url', '')
              filename = urllib.parse.unquote(url.rstrip('/').split('/')[-1])
              path = os.path.join(BUILD_DIR, filename)

              if not os.path.isfile(path):
                  print(f"warn: {path} not found, skipping {item.get('internalName')}")
                  continue

              with open(path, 'rb') as f:
                  data = f.read()

              new_hash = 'sha256-' + hashlib.sha256(data).hexdigest()
              old_hash = item.get('fileHash')

              item['fileSize'] = len(data)
              item['fileHash'] = new_hash

              if old_hash is not None and old_hash != new_hash:
                  item['version'] = int(item.get('version', 0)) + 1
                  print(f"bumped {filename} -> v{item['version']}")

              updated += 1
              print(f"updated {filename}: {len(data)} bytes")

          with open(PLUGINS_JSON, 'w', encoding='utf-8') as f:
              json.dump(plugins, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f"done: {updated}/{len(plugins)} entries updated")
          EOF
      - name: Push
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/ plugins.json
          git commit -m "update cs3 + plugins.json [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
      - uses: actions/upload-artifact@v4
        with:
          name: all-extensions-cs3
          path: build/*.cs3
