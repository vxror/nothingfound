name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build all extensions
        run: |
          chmod +x gradlew
          ./gradlew make --no-daemon

      - name: Collect all .cs3 files (universal)
        run: |
          mkdir -p build
          # Find every .cs3 file Gradle produced in any subproject
          find . -path "*/build/*.cs3" -print0 | while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            echo "Found: $file -> build/$filename"
            cp "$file" "build/$filename"
          done
          echo "=== Final build folder ==="
          ls -la build/

      - name: Commit all .cs3 files
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/*.cs3
          git commit -m "update cs3 [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload all .cs3 files
        uses: actions/upload-artifact@v4
        with:
          name: all-extensions-cs3
          path: build/*.cs3
          if-no-files-found: warn
